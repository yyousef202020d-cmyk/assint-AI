<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astra AI | المساعد الذكي الخارق</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Kufi+Arabic:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <main class="app-container">
        <header>
            <div class="logo">
                <span class="logo-icon">✨</span>
                <h1>ASTRA AI</h1>
            </div>
            <div class="status-indicator">
                <span class="pulse"></span> متصل وجاهز
            </div>
        </header>

        <section class="chat-display" id="chatDisplay">
            <div class="message ai-message">
                <div class="avatar">A</div>
                <div class="content">
                    أهلاً بك يا صاحبي! أنا مساعدك الذكي أسترا. يمكنني إرسال رسائل واتسساب، والرد على إيميلاتك، والتحكم في جهازك. ماذا تريد أن أفعل اليوم؟
                </div>
            </div>
        </section>

        <section class="controls">
            <div class="input-wrapper">
                <input type="text" id="userInput" placeholder="اسألني أي شيء أو اطلب تنفيذ مهمة..." autocomplete="off">
                <button id="voiceBtn" class="voice-btn">
                    <i class="fas fa-microphone"></i>
                </button>
            </div>
            <button id="sendBtn" class="send-btn">
                ارسل الأمر
            </button>
        </section>

        <section class="quick-actions">
            <div class="action-card" onclick="setCommand('ارسل رسالة واتساب إلى...')">
                <i class="fab fa-whatsapp"></i>
                <span>واتساب</span>
            </div>
            <div class="action-card" onclick="setCommand('تحقق من بريدي الإلكتروني')">
                <i class="fas fa-envelope"></i>
                <span>جي ميل</span>
            </div>
            <div class="action-card" onclick="setCommand('افتح تطبيق...')">
                <i class="fas fa-th-large"></i>
                <span>تطبيقات</span>
            </div>
            <div class="action-card" onclick="setCommand('ما هي حالة الطقس؟')">
                <i class="fas fa-cloud-sun"></i>
                <span>الطقس</span>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
